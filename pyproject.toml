[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "y4rb"
version = "0.1.1"
description = "Yet Another Resumé Builder"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.13.3",
    "pyyaml>=6.0",
    "playwright>=1.49",
    "typer>=0.25.0",
    "watchfiles>=1.0",
]

[project.scripts]
y4rb = "y4rb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["y4rb"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["y4rb"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]
docs = [
    "mkdocs-material>=9.5",
    "mike>=2.0",
]
