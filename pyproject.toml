[project]
name = "y4rb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.13.3",
    "pyyaml>=6.0",
    "playwright>=1.49",
    "typer>=0.25.0",
    "watchfiles>=1.0",
]

[project.scripts]
y4rb = "y4rb.cli:app"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["y4rb"]

[tool.coverage.report]
show_missing = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.33",
]
